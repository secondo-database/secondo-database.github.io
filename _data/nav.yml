# Each entry is a group. A group without a `label` renders its items as
# top-level links; a group with a `label` renders a heading and an indented
# sub-list.
#
# Item keys:
#   title  link text (may contain HTML)
#   url    href, and the page.url that marks the item active
#   match  optional path prefix; any page whose url starts with it also marks
#          the item active. Used for sub-project sections that have their own
#          pages below an index.

