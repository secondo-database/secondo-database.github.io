<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description }}">
{% if page.noindex %}<meta name="robots" content="noindex, nofollow">
{% else %}<meta name="robots" content="index, follow">
{% endif %}<title>{{ page.title | default: site.title }}</title>
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/images/logo.gif' | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/images/logo.gif' | absolute_url }}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" type="text/css" href="/secondo.css?v={{ site.time | date: '%s' }}">
{% if page.extra_css %}<link rel="stylesheet" type="text/css" href="{{ page.extra_css }}?v={{ site.time | date: '%s' }}">
{% endif %}</head>
<body>
{% include nav.html %}
<main>
{% unless page.hide_logo %}
<div style="text-align:center;">
<img alt="SECONDO" src="/images/logo.gif" height="107" width="598">
</div>
{% endunless %}
{{ content }}
</main>
</body>
</html>
